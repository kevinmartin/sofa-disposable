# yaml-language-server: $schema=https://raw.githubusercontent.com/kevinmartin/sofa/v0/schemas/sofa.schema.json
# Project ID is filled after the designated disposable Project is created.
schema_version: 1
repository: kevinmartin/sofa-disposable
repository_id: R_kgDOUmB_jw
project_id: PVT_kwHOAAfL7c4Bke1I
owner_id: MDQ6VXNlcjUxMDk1Nw==
ready_status: Ready
lifecycle:
  statuses:
    inbox: Inbox
    discovery: Discovery
    spec_review: Spec Review
    backlog: Backlog
    ready: Ready
    building: Building
    verification: Verification
    review: Review
    release: Release
    done: Done
  poll_minutes: 60 # Disposable economy schedule; manual wakes remain available.
  discovery_wip: 2
  delivery_wip: 1
  spec_author_id: MDM6Qm90NDE4OTgyODI= # github-actions[bot] issue-comment author
  release:
    required_checks:
      - name: sofa-post-merge-smoke
        app_id: 15368 # GitHub Actions
allowed_paths:
  - fixture/greeting.go
profile:
  agent: copilot
  secret_env: SOFA_MODEL_TOKEN
limits:
  attempt_seconds: 600
  repair_attempts: 1
  infra_retries: 1
  max_agent_turns: 2 # Allow one bounded Discovery revision after the initial draft.
  max_files: 10
  max_file_bytes: 131072
  max_total_bytes: 524288
checks:
  - id: go-test
    argv: [go, test, ./...]
    timeout_seconds: 120
recipe:
  kind: gofmt
  paths:
    - fixture/greeting.go
