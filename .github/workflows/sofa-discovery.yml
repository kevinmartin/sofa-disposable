# Kevin starts one Discovery turn for an issue in the private Project. The
# resulting specification remains in Spec Review until he approves Backlog.
name: sofa disposable Discovery

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue currently in the private Project's Discovery status
        required: true
        type: number

permissions: {}

concurrency:
  group: sofa-discovery-${{ github.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  discovery:
    if: github.event.repository.fork == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
      issues: write
      actions: read
      copilot-requests: write
    uses: kevinmartin/sofa/.github/workflows/discovery.reusable.yml@5cc62356fd022471fabf82f6ea2ff110177185fb
    with:
      issue_number: ${{ fromJSON(inputs.issue_number) }}
      toolkit_sha: 5cc62356fd022471fabf82f6ea2ff110177185fb
    secrets:
      SOFA_PROJECTS_TOKEN: ${{ secrets.SOFA_PROJECTS_TOKEN }}
