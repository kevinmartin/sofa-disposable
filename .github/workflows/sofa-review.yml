# Kevin's submitted CHANGES_REQUESTED review on the exact open PR is checked
# by the trusted controller before one budgeted repair can update that PR.
name: sofa disposable bounded review repair

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Admitted issue whose draft PR has owner review feedback
        required: true
        type: number

permissions: {}

jobs:
  repair:
    if: github.event.repository.fork == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
      actions: read
      pull-requests: read
      copilot-requests: write
    uses: kevinmartin/sofa/.github/workflows/review.reusable.yml@c9f459c19945502a66d54f23c65bb66fec0b7ce2
    with:
      issue_number: ${{ fromJSON(inputs.issue_number) }}
      toolkit_sha: c9f459c19945502a66d54f23c65bb66fec0b7ce2
    secrets:
      SOFA_PROJECTS_TOKEN: ${{ secrets.SOFA_PROJECTS_TOKEN }}
      SOFA_PUBLISH_TOKEN: ${{ secrets.SOFA_PUBLISH_TOKEN }}
