name: sofa security boundary canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sentinel:
    if: github.event.repository.fork == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out disposable workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: consumer
      - name: Check out immutable sofa toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: kevinmartin/sofa
          ref: 02cb9f83c2a6f0068dd3a7c1910f6c78cd0ebaaf
          persist-credentials: false
          path: toolkit
      - name: Verify toolkit identity
        run: test "$(git -C toolkit rev-parse HEAD)" = 02cb9f83c2a6f0068dd3a7c1910f6c78cd0ebaaf
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: toolkit/go.mod
          cache: false
      - name: Exercise candidate, process cleanup, evidence, and credential guards
        working-directory: toolkit
        run: go test -count=1 ./internal/integrity ./internal/github ./internal/agent ./internal/state ./cmd/sofa
      - name: Build the trusted worker mount
        working-directory: toolkit
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p "$RUNNER_TEMP/sofa-cli"
          go build -trimpath -o "$RUNNER_TEMP/sofa-cli/sofa" ./cmd/sofa
      - name: Probe isolated container with inert host-only credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate transport "$RUNNER_TEMP/copilot-package" "$RUNNER_TEMP/sofa-privileged"
          export SOFA_PROJECTS_TOKEN="$(openssl rand -hex 32)"
          export SOFA_PUBLISH_TOKEN="$(openssl rand -hex 32)"
          export SOFA_STATE_TOKEN="$(openssl rand -hex 32)"
          export SOFA_APP_PRIVATE_KEY="$(openssl rand -hex 32)"
          export SOFA_MODEL_TOKEN="$(openssl rand -hex 32)"
          printf '%s' "$SOFA_PROJECTS_TOKEN" > "$RUNNER_TEMP/sofa-privileged/sentinel"
          cat > "$RUNNER_TEMP/sofa-cli/probe.js" <<'JS'
          const fs = require('node:fs');
          for (const name of ['SOFA_PROJECTS_TOKEN', 'SOFA_PUBLISH_TOKEN', 'SOFA_STATE_TOKEN', 'SOFA_APP_PRIVATE_KEY']) {
            if (Object.hasOwn(process.env, name)) throw new Error('privileged environment variable reached container');
          }
          if (!process.env.SOFA_MODEL_TOKEN) throw new Error('model-only environment mapping missing');
          for (const name of ['/workspace', '/transport', '/candidate', '/toolkit', '/copilot-package']) {
            if (!fs.statSync(name).isDirectory()) throw new Error('expected mount missing');
          }
          if (fs.existsSync(process.argv[2])) throw new Error('host-only credential file reached container');
          fs.writeFileSync('/candidate/probe', 'ok');
          fs.unlinkSync('/candidate/probe');
          for (const name of ['/transport/probe', '/toolkit/probe', '/copilot-package/probe']) {
            try {
              fs.writeFileSync(name, 'bad');
              throw new Error('trusted mount became writable');
            } catch (error) {
              if (error.code !== 'EROFS' && error.code !== 'EACCES') throw error;
            }
          }
          console.log('isolated boundary probe passed');
          JS
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges --read-only \
            --pids-limit 128 --memory 3g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --tmpfs /home/sofa:rw,nosuid,nodev,size=64m \
            --mount "type=bind,src=$PWD/consumer,dst=/workspace" \
            --mount "type=bind,src=$PWD/transport,dst=/transport,readonly" \
            --mount "type=bind,src=$PWD/candidate,dst=/candidate" \
            --mount "type=bind,src=$RUNNER_TEMP/sofa-cli,dst=/toolkit,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/copilot-package,dst=/copilot-package,readonly" \
            --env SOFA_MODEL_TOKEN \
            --env HOME=/home/sofa \
            --env PATH=/toolkit:/usr/local/bin:/usr/bin:/bin \
            node:24-bookworm@sha256:b977d0f785d96029d8d4c0790b6bf1c2a4c72e0f26319808e7ba2e9d966a1ac3 \
            /usr/local/bin/node /toolkit/probe.js "$RUNNER_TEMP/sofa-privileged/sentinel"
          for name in SOFA_PROJECTS_TOKEN SOFA_PUBLISH_TOKEN SOFA_STATE_TOKEN SOFA_APP_PRIVATE_KEY; do
            if grep -R -F -q -- "${!name}" candidate transport consumer; then
              echo 'privileged sentinel appeared in a mounted path' >&2
              exit 1
            fi
          done
