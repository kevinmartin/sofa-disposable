# Project lifecycle canary. A scheduled tick and a manual wake use the same
# deterministic reconciler; neither authorizes Backlog or Ready on Kevin's behalf.
name: sofa disposable lifecycle

on:
  workflow_dispatch:
    inputs:
      wake_id:
        description: Optional stable event identifier for a manual wake
        required: false
        type: string
  schedule:
    - cron: '17 * * * *' # Hourly disposable economy preset.

permissions: {}

jobs:
  lifecycle:
    # GitHub schedules only the default branch; the event need not supply its name.
    if: github.event_name == 'schedule' || (github.event.repository.fork == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    permissions:
      contents: write
      issues: read
      pull-requests: read
      checks: read
      actions: write
    uses: kevinmartin/sofa/.github/workflows/lifecycle.reusable.yml@566e6e050a366dc68a9d9bc5e267ce3e3369ddb0
    with:
      toolkit_sha: 566e6e050a366dc68a9d9bc5e267ce3e3369ddb0
      wake_id: ${{ inputs.wake_id || '' }}
      delivery_workflow: sofa.yml
    secrets:
      SOFA_PROJECTS_TOKEN: ${{ secrets.SOFA_PROJECTS_TOKEN }}
