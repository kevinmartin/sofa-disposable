name: sofa hosted E2E candidate
on:
  workflow_dispatch:
    inputs:
      sofa_pr: {type: string, required: false}
      candidate_sha: {type: string, required: false}
      base_sha: {type: string, required: false}
      source_run_id: {type: string, required: false}
      source_run_attempt: {type: string, required: false}
      mode: {type: string, required: false}
      producer_run_id: {type: string, required: false}
permissions: {}
jobs:
  candidate:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@992dde56dd45cf0b44a549ea733ab25c2b310847
    with:
      suite_id: p18-663ed3650450874b1ce2779d
      scenario: edit
      candidate_sha: 992dde56dd45cf0b44a549ea733ab25c2b310847
      base_sha: e1d29cb290d51e45436d931de6e943f172a20ba8
      disposable_base_sha: f4445b7815b526677259631270abde5dff46e9dd
      reconcile_candidate: false
      publish_fault: before-publication
  deny-non-ready:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@992dde56dd45cf0b44a549ea733ab25c2b310847
    with:
      suite_id: p18-195312106649d48af02a45d9
      scenario: denied
      denial_kind: non-ready
      candidate_sha: 992dde56dd45cf0b44a549ea733ab25c2b310847
      base_sha: e1d29cb290d51e45436d931de6e943f172a20ba8
      disposable_base_sha: f4445b7815b526677259631270abde5dff46e9dd
      reconcile_candidate: false
  deny-completed-redelivery:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@992dde56dd45cf0b44a549ea733ab25c2b310847
    with:
      suite_id: p18-a1e0cbcdf60dbf075936f34e
      scenario: denied
      denial_kind: completed-redelivery
      candidate_sha: 992dde56dd45cf0b44a549ea733ab25c2b310847
      base_sha: e1d29cb290d51e45436d931de6e943f172a20ba8
      disposable_base_sha: f4445b7815b526677259631270abde5dff46e9dd
      reconcile_candidate: false
  recover:
    if: inputs.mode == 'recovery' && inputs.producer_run_id != ''
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@992dde56dd45cf0b44a549ea733ab25c2b310847
    with:
      suite_id: p18-663ed3650450874b1ce2779d
      scenario: edit
      candidate_sha: 992dde56dd45cf0b44a549ea733ab25c2b310847
      base_sha: e1d29cb290d51e45436d931de6e943f172a20ba8
      disposable_base_sha: f4445b7815b526677259631270abde5dff46e9dd
      reconcile_candidate: true
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_run_attempt: '1'
