name: sofa hosted E2E candidate
on:
  workflow_dispatch:
    inputs:
      sofa_pr: {type: string, required: false}
      candidate_sha: {type: string, required: false}
      base_sha: {type: string, required: false}
      source_run_id: {type: string, required: false}
      source_run_attempt: {type: string, required: false}
      mode: {type: string, required: false}
      producer_run_id: {type: string, required: false}
permissions: {}
jobs:
  candidate:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@6fe3680a86dd6626e5ad312b1fb8b12ac8851077
    with:
      suite_id: p18-e4aeb389ae0a9d62d9517d8e
      scenario: edit
      candidate_sha: 6fe3680a86dd6626e5ad312b1fb8b12ac8851077
      base_sha: e5ed5b07fb81d20ec84916d05d8aed7ae274f888
      disposable_base_sha: 4d060392743f4dc3057d406c9b78045660c29f98
      reconcile_candidate: false
      publish_fault: before-publication
  deny-non-ready:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@6fe3680a86dd6626e5ad312b1fb8b12ac8851077
    with:
      suite_id: p18-0876be73b4a1808dbff0ed95
      scenario: denied
      denial_kind: non-ready
      candidate_sha: 6fe3680a86dd6626e5ad312b1fb8b12ac8851077
      base_sha: e5ed5b07fb81d20ec84916d05d8aed7ae274f888
      disposable_base_sha: 4d060392743f4dc3057d406c9b78045660c29f98
      reconcile_candidate: false
  deny-completed-redelivery:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@6fe3680a86dd6626e5ad312b1fb8b12ac8851077
    with:
      suite_id: p18-1717c01f4d84b38256192b1c
      scenario: denied
      denial_kind: completed-redelivery
      candidate_sha: 6fe3680a86dd6626e5ad312b1fb8b12ac8851077
      base_sha: e5ed5b07fb81d20ec84916d05d8aed7ae274f888
      disposable_base_sha: 4d060392743f4dc3057d406c9b78045660c29f98
      reconcile_candidate: false
  recover:
    if: inputs.mode == 'recovery' && inputs.producer_run_id != ''
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@6fe3680a86dd6626e5ad312b1fb8b12ac8851077
    with:
      suite_id: p18-e4aeb389ae0a9d62d9517d8e
      scenario: edit
      candidate_sha: 6fe3680a86dd6626e5ad312b1fb8b12ac8851077
      base_sha: e5ed5b07fb81d20ec84916d05d8aed7ae274f888
      disposable_base_sha: 4d060392743f4dc3057d406c9b78045660c29f98
      reconcile_candidate: true
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_run_attempt: '1'
