name: sofa hosted E2E candidate
on:
  workflow_dispatch:
    inputs:
      reconcile_candidate: {type: boolean, required: false, default: false}
      publish_fault: {type: string, required: false, default: ''}
      producer_run_id: {type: string, required: false, default: ''}
      producer_run_attempt: {type: string, required: false, default: ''}
permissions: {}
jobs:
  candidate:
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@78b8fab2a6e3f2f51c7ceb39d2c00b400424371a
    with:
      suite_id: p2-46f30e7ab384940af9efcb78
      scenario: edit
      candidate_sha: 78b8fab2a6e3f2f51c7ceb39d2c00b400424371a
      base_sha: bc5623fa9128e58efb391e1cdd6ce69f339bb9e5
      disposable_base_sha: 7ffd2ed6d4bb927c8b903e5f5aed0b88cd60e5e3
      reconcile_candidate: ${{ inputs.reconcile_candidate }}
      publish_fault: ${{ inputs.publish_fault }}
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_run_attempt: ${{ inputs.producer_run_attempt }}
