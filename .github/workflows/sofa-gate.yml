name: sofa hosted E2E candidate
on:
  workflow_dispatch:
    inputs:
      sofa_pr: {type: string, required: false}
      candidate_sha: {type: string, required: false}
      base_sha: {type: string, required: false}
      source_run_id: {type: string, required: false}
      source_run_attempt: {type: string, required: false}
      mode: {type: string, required: false}
      producer_run_id: {type: string, required: false}
permissions: {}
jobs:
  candidate:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@f29779f8ba86fb68079dfb454158d3322a4b75f7
    with:
      suite_id: p7-80e7523ebc727e7c69d26d52
      scenario: edit
      candidate_sha: f29779f8ba86fb68079dfb454158d3322a4b75f7
      base_sha: 623b854e2cbca5ec8d64b75456daf3d7a2924162
      disposable_base_sha: 75cdc5613f1b6287990eeb8abc771a4746e6d5d3
      reconcile_candidate: false
      publish_fault: before-publication
  deny-non-ready:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@f29779f8ba86fb68079dfb454158d3322a4b75f7
    with:
      suite_id: p7-f2f27fd4720cf93ff90bb17e
      scenario: denied
      denial_kind: non-ready
      candidate_sha: f29779f8ba86fb68079dfb454158d3322a4b75f7
      base_sha: 623b854e2cbca5ec8d64b75456daf3d7a2924162
      disposable_base_sha: 75cdc5613f1b6287990eeb8abc771a4746e6d5d3
      reconcile_candidate: false
  deny-completed-redelivery:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@f29779f8ba86fb68079dfb454158d3322a4b75f7
    with:
      suite_id: p7-fc3948afd83841bdc75c7537
      scenario: denied
      denial_kind: completed-redelivery
      candidate_sha: f29779f8ba86fb68079dfb454158d3322a4b75f7
      base_sha: 623b854e2cbca5ec8d64b75456daf3d7a2924162
      disposable_base_sha: 75cdc5613f1b6287990eeb8abc771a4746e6d5d3
      reconcile_candidate: false
  recover:
    if: inputs.mode == 'recovery' && inputs.producer_run_id != ''
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@f29779f8ba86fb68079dfb454158d3322a4b75f7
    with:
      suite_id: p7-80e7523ebc727e7c69d26d52
      scenario: edit
      candidate_sha: f29779f8ba86fb68079dfb454158d3322a4b75f7
      base_sha: 623b854e2cbca5ec8d64b75456daf3d7a2924162
      disposable_base_sha: 75cdc5613f1b6287990eeb8abc771a4746e6d5d3
      reconcile_candidate: true
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_run_attempt: '1'
