name: sofa hosted E2E candidate
on:
  workflow_dispatch:
    inputs:
      sofa_pr: {type: string, required: false}
      candidate_sha: {type: string, required: false}
      base_sha: {type: string, required: false}
      source_run_id: {type: string, required: false}
      source_run_attempt: {type: string, required: false}
      mode: {type: string, required: false}
      producer_run_id: {type: string, required: false}
permissions: {}
jobs:
  candidate:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@9c067fb1df3850a2e7963550de7ee9d4997a5c79
    with:
      suite_id: p2-9c06881bd91a48e6d266f0f1
      scenario: edit
      candidate_sha: 9c067fb1df3850a2e7963550de7ee9d4997a5c79
      base_sha: bc5623fa9128e58efb391e1cdd6ce69f339bb9e5
      disposable_base_sha: dd6a2c41431f08e4b41a529f4311ceee929fae77
      reconcile_candidate: false
      publish_fault: before-publication
  deny-non-ready:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@9c067fb1df3850a2e7963550de7ee9d4997a5c79
    with:
      suite_id: p2-1ba87844c2675ade84c3bb95
      scenario: denied
      denial_kind: non-ready
      candidate_sha: 9c067fb1df3850a2e7963550de7ee9d4997a5c79
      base_sha: bc5623fa9128e58efb391e1cdd6ce69f339bb9e5
      disposable_base_sha: dd6a2c41431f08e4b41a529f4311ceee929fae77
      reconcile_candidate: false
  deny-completed-redelivery:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@9c067fb1df3850a2e7963550de7ee9d4997a5c79
    with:
      suite_id: p2-6ce38cf91394f203116d2606
      scenario: denied
      denial_kind: completed-redelivery
      candidate_sha: 9c067fb1df3850a2e7963550de7ee9d4997a5c79
      base_sha: bc5623fa9128e58efb391e1cdd6ce69f339bb9e5
      disposable_base_sha: dd6a2c41431f08e4b41a529f4311ceee929fae77
      reconcile_candidate: false
  recover:
    if: inputs.mode == 'recovery' && inputs.producer_run_id != ''
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@9c067fb1df3850a2e7963550de7ee9d4997a5c79
    with:
      suite_id: p2-9c06881bd91a48e6d266f0f1
      scenario: edit
      candidate_sha: 9c067fb1df3850a2e7963550de7ee9d4997a5c79
      base_sha: bc5623fa9128e58efb391e1cdd6ce69f339bb9e5
      disposable_base_sha: dd6a2c41431f08e4b41a529f4311ceee929fae77
      reconcile_candidate: true
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_run_attempt: '1'
