name: sofa hosted E2E candidate
on:
  workflow_dispatch:
    inputs:
      sofa_pr: {type: string, required: false}
      candidate_sha: {type: string, required: false}
      base_sha: {type: string, required: false}
      source_run_id: {type: string, required: false}
      source_run_attempt: {type: string, required: false}
      mode: {type: string, required: false}
      producer_run_id: {type: string, required: false}
permissions: {}
jobs:
  candidate:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@ebd0fb8eaa6075eafde775aea903f709cdf6e690
    with:
      suite_id: p20-fc7d37226952c8dcec136828
      scenario: edit
      candidate_sha: ebd0fb8eaa6075eafde775aea903f709cdf6e690
      base_sha: 29081e1aa7c4286dd0edb570cf252c575d55dfea
      disposable_base_sha: b6097d4b3eb35434d21e161d3ce2e7bb0ca4d64d
      reconcile_candidate: false
      publish_fault: before-publication
  deny-non-ready:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@ebd0fb8eaa6075eafde775aea903f709cdf6e690
    with:
      suite_id: p20-9fed76d8e32ed40235f3cff9
      scenario: denied
      denial_kind: non-ready
      candidate_sha: ebd0fb8eaa6075eafde775aea903f709cdf6e690
      base_sha: 29081e1aa7c4286dd0edb570cf252c575d55dfea
      disposable_base_sha: b6097d4b3eb35434d21e161d3ce2e7bb0ca4d64d
      reconcile_candidate: false
  deny-completed-redelivery:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@ebd0fb8eaa6075eafde775aea903f709cdf6e690
    with:
      suite_id: p20-d5d3ef32540fc4a36f80ce73
      scenario: denied
      denial_kind: completed-redelivery
      candidate_sha: ebd0fb8eaa6075eafde775aea903f709cdf6e690
      base_sha: 29081e1aa7c4286dd0edb570cf252c575d55dfea
      disposable_base_sha: b6097d4b3eb35434d21e161d3ce2e7bb0ca4d64d
      reconcile_candidate: false
  recover:
    if: inputs.mode == 'recovery' && inputs.producer_run_id != ''
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@ebd0fb8eaa6075eafde775aea903f709cdf6e690
    with:
      suite_id: p20-fc7d37226952c8dcec136828
      scenario: edit
      candidate_sha: ebd0fb8eaa6075eafde775aea903f709cdf6e690
      base_sha: 29081e1aa7c4286dd0edb570cf252c575d55dfea
      disposable_base_sha: b6097d4b3eb35434d21e161d3ce2e7bb0ca4d64d
      reconcile_candidate: true
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_run_attempt: '1'
