name: sofa hosted E2E candidate
on:
  workflow_dispatch:
    inputs:
      sofa_pr: {type: string, required: false}
      candidate_sha: {type: string, required: false}
      base_sha: {type: string, required: false}
      source_run_id: {type: string, required: false}
      source_run_attempt: {type: string, required: false}
      mode: {type: string, required: false}
      producer_run_id: {type: string, required: false}
permissions: {}
jobs:
  candidate:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@00ba32bdac93da37b943756120b135a1f1d94700
    with:
      suite_id: p14-5977f0ff67dd44eec424eb73
      scenario: edit
      candidate_sha: 00ba32bdac93da37b943756120b135a1f1d94700
      base_sha: 144fbafe49f6a6e131d8075a29c44a7684aa37ef
      disposable_base_sha: b25bf7faab74222f3054f302e9a4f72230897ac8
      reconcile_candidate: false
      publish_fault: before-publication
  deny-non-ready:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@00ba32bdac93da37b943756120b135a1f1d94700
    with:
      suite_id: p14-c0212d7db4a1720179f43241
      scenario: denied
      denial_kind: non-ready
      candidate_sha: 00ba32bdac93da37b943756120b135a1f1d94700
      base_sha: 144fbafe49f6a6e131d8075a29c44a7684aa37ef
      disposable_base_sha: b25bf7faab74222f3054f302e9a4f72230897ac8
      reconcile_candidate: false
  deny-completed-redelivery:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@00ba32bdac93da37b943756120b135a1f1d94700
    with:
      suite_id: p14-ac04c54b5536d798d4674627
      scenario: denied
      denial_kind: completed-redelivery
      candidate_sha: 00ba32bdac93da37b943756120b135a1f1d94700
      base_sha: 144fbafe49f6a6e131d8075a29c44a7684aa37ef
      disposable_base_sha: b25bf7faab74222f3054f302e9a4f72230897ac8
      reconcile_candidate: false
  recover:
    if: inputs.mode == 'recovery' && inputs.producer_run_id != ''
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@00ba32bdac93da37b943756120b135a1f1d94700
    with:
      suite_id: p14-5977f0ff67dd44eec424eb73
      scenario: edit
      candidate_sha: 00ba32bdac93da37b943756120b135a1f1d94700
      base_sha: 144fbafe49f6a6e131d8075a29c44a7684aa37ef
      disposable_base_sha: b25bf7faab74222f3054f302e9a4f72230897ac8
      reconcile_candidate: true
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_run_attempt: '1'
