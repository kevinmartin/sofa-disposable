name: sofa hosted E2E candidate
on:
  workflow_dispatch:
    inputs:
      sofa_pr: {type: string, required: false}
      candidate_sha: {type: string, required: false}
      base_sha: {type: string, required: false}
      source_run_id: {type: string, required: false}
      source_run_attempt: {type: string, required: false}
      mode: {type: string, required: false}
      producer_run_id: {type: string, required: false}
permissions: {}
jobs:
  candidate:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@9972c32869981fab36c819a4372d5acd5f2f6d02
    with:
      suite_id: p23-9ccccf7bc3a79a4b428a9bec
      scenario: edit
      candidate_sha: 9972c32869981fab36c819a4372d5acd5f2f6d02
      base_sha: 41cb5efad9a53a197f9bd8c3e661577b38da2ab7
      disposable_base_sha: 5814d3d79513563b9e63fb4f8fbd7c86b0bea47c
      reconcile_candidate: false
      publish_fault: before-publication
  deny-non-ready:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@9972c32869981fab36c819a4372d5acd5f2f6d02
    with:
      suite_id: p23-d810e5934db3be4d4ceddd9c
      scenario: denied
      denial_kind: non-ready
      candidate_sha: 9972c32869981fab36c819a4372d5acd5f2f6d02
      base_sha: 41cb5efad9a53a197f9bd8c3e661577b38da2ab7
      disposable_base_sha: 5814d3d79513563b9e63fb4f8fbd7c86b0bea47c
      reconcile_candidate: false
  deny-completed-redelivery:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@9972c32869981fab36c819a4372d5acd5f2f6d02
    with:
      suite_id: p23-f47ba299f1f3bb67ca341d14
      scenario: denied
      denial_kind: completed-redelivery
      candidate_sha: 9972c32869981fab36c819a4372d5acd5f2f6d02
      base_sha: 41cb5efad9a53a197f9bd8c3e661577b38da2ab7
      disposable_base_sha: 5814d3d79513563b9e63fb4f8fbd7c86b0bea47c
      reconcile_candidate: false
  recover:
    if: inputs.mode == 'recovery' && inputs.producer_run_id != ''
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@9972c32869981fab36c819a4372d5acd5f2f6d02
    with:
      suite_id: p23-9ccccf7bc3a79a4b428a9bec
      scenario: edit
      candidate_sha: 9972c32869981fab36c819a4372d5acd5f2f6d02
      base_sha: 41cb5efad9a53a197f9bd8c3e661577b38da2ab7
      disposable_base_sha: 5814d3d79513563b9e63fb4f8fbd7c86b0bea47c
      reconcile_candidate: true
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_run_attempt: '1'
