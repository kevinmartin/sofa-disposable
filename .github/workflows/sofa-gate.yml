name: sofa hosted E2E candidate
on:
  workflow_dispatch:
    inputs:
      sofa_pr: {type: string, required: false}
      candidate_sha: {type: string, required: false}
      base_sha: {type: string, required: false}
      source_run_id: {type: string, required: false}
      source_run_attempt: {type: string, required: false}
      mode: {type: string, required: false}
      producer_run_id: {type: string, required: false}
permissions: {}
jobs:
  candidate:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@3170fb8a99f90844da0c4452dacb185aa9f9ef36
    with:
      suite_id: p2-30396f06aca1e154beb32f2c
      scenario: edit
      candidate_sha: 3170fb8a99f90844da0c4452dacb185aa9f9ef36
      base_sha: 25a87507735bc91ee9e37edf12324e26e37dc69f
      disposable_base_sha: f671cd1c0a0ba06d87153783b92ca687b3687d5e
      reconcile_candidate: false
      publish_fault: before-publication
  deny-non-ready:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@3170fb8a99f90844da0c4452dacb185aa9f9ef36
    with:
      suite_id: p2-21d5f31c38b6c273787ab728
      scenario: denied
      denial_kind: non-ready
      candidate_sha: 3170fb8a99f90844da0c4452dacb185aa9f9ef36
      base_sha: 25a87507735bc91ee9e37edf12324e26e37dc69f
      disposable_base_sha: f671cd1c0a0ba06d87153783b92ca687b3687d5e
      reconcile_candidate: false
  deny-completed-redelivery:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@3170fb8a99f90844da0c4452dacb185aa9f9ef36
    with:
      suite_id: p2-d2c1c7c8aba631d736f9cc2c
      scenario: denied
      denial_kind: completed-redelivery
      candidate_sha: 3170fb8a99f90844da0c4452dacb185aa9f9ef36
      base_sha: 25a87507735bc91ee9e37edf12324e26e37dc69f
      disposable_base_sha: f671cd1c0a0ba06d87153783b92ca687b3687d5e
      reconcile_candidate: false
  recover:
    if: inputs.mode == 'recovery' && inputs.producer_run_id != ''
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@3170fb8a99f90844da0c4452dacb185aa9f9ef36
    with:
      suite_id: p2-30396f06aca1e154beb32f2c
      scenario: edit
      candidate_sha: 3170fb8a99f90844da0c4452dacb185aa9f9ef36
      base_sha: 25a87507735bc91ee9e37edf12324e26e37dc69f
      disposable_base_sha: f671cd1c0a0ba06d87153783b92ca687b3687d5e
      reconcile_candidate: true
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_run_attempt: '1'
