name: sofa hosted E2E candidate
on:
  workflow_dispatch:
    inputs:
      sofa_pr: {type: string, required: false}
      candidate_sha: {type: string, required: false}
      base_sha: {type: string, required: false}
      source_run_id: {type: string, required: false}
      source_run_attempt: {type: string, required: false}
      mode: {type: string, required: false}
      producer_run_id: {type: string, required: false}
permissions: {}
jobs:
  candidate:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@78fce650a0f2f103685128def6ee7a8229cd6c5b
    with:
      suite_id: p5-0a9bcbff1f2089831a1526d1
      scenario: edit
      candidate_sha: 78fce650a0f2f103685128def6ee7a8229cd6c5b
      base_sha: 15248c465f7fcc727d1618ba2c19e6d53e57575e
      disposable_base_sha: 2c9489bca38b7fe3faa31cab7981da8800b1c14d
      reconcile_candidate: false
      publish_fault: before-publication
  deny-non-ready:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@78fce650a0f2f103685128def6ee7a8229cd6c5b
    with:
      suite_id: p5-04ff5d55f85c9690fbdc4fd5
      scenario: denied
      denial_kind: non-ready
      candidate_sha: 78fce650a0f2f103685128def6ee7a8229cd6c5b
      base_sha: 15248c465f7fcc727d1618ba2c19e6d53e57575e
      disposable_base_sha: 2c9489bca38b7fe3faa31cab7981da8800b1c14d
      reconcile_candidate: false
  deny-completed-redelivery:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@78fce650a0f2f103685128def6ee7a8229cd6c5b
    with:
      suite_id: p5-860005a96f11092f371e997b
      scenario: denied
      denial_kind: completed-redelivery
      candidate_sha: 78fce650a0f2f103685128def6ee7a8229cd6c5b
      base_sha: 15248c465f7fcc727d1618ba2c19e6d53e57575e
      disposable_base_sha: 2c9489bca38b7fe3faa31cab7981da8800b1c14d
      reconcile_candidate: false
  recover:
    if: inputs.mode == 'recovery' && inputs.producer_run_id != ''
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@78fce650a0f2f103685128def6ee7a8229cd6c5b
    with:
      suite_id: p5-0a9bcbff1f2089831a1526d1
      scenario: edit
      candidate_sha: 78fce650a0f2f103685128def6ee7a8229cd6c5b
      base_sha: 15248c465f7fcc727d1618ba2c19e6d53e57575e
      disposable_base_sha: 2c9489bca38b7fe3faa31cab7981da8800b1c14d
      reconcile_candidate: true
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_run_attempt: '1'
