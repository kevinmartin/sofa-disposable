name: sofa hosted E2E candidate
on:
  workflow_dispatch:
    inputs:
      sofa_pr: {type: string, required: false}
      candidate_sha: {type: string, required: false}
      base_sha: {type: string, required: false}
      source_run_id: {type: string, required: false}
      source_run_attempt: {type: string, required: false}
      mode: {type: string, required: false}
      producer_run_id: {type: string, required: false}
permissions: {}
jobs:
  candidate:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@ab288d823433eace4f98f7a9b63f88a0726aec6c
    with:
      suite_id: p11-611bdc7f1256e000fde672b3
      scenario: edit
      candidate_sha: ab288d823433eace4f98f7a9b63f88a0726aec6c
      base_sha: 29b16b3d0437335402a2c350c0958e4a9c229b09
      disposable_base_sha: 9d4dc05724e55a9b090e0895abbf24ff5be97fed
      reconcile_candidate: false
      publish_fault: before-publication
  deny-non-ready:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@ab288d823433eace4f98f7a9b63f88a0726aec6c
    with:
      suite_id: p11-fd425a7c326e917d0d45ef78
      scenario: denied
      denial_kind: non-ready
      candidate_sha: ab288d823433eace4f98f7a9b63f88a0726aec6c
      base_sha: 29b16b3d0437335402a2c350c0958e4a9c229b09
      disposable_base_sha: 9d4dc05724e55a9b090e0895abbf24ff5be97fed
      reconcile_candidate: false
  deny-completed-redelivery:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@ab288d823433eace4f98f7a9b63f88a0726aec6c
    with:
      suite_id: p11-3aae30f3f54c5ae64ee17cc0
      scenario: denied
      denial_kind: completed-redelivery
      candidate_sha: ab288d823433eace4f98f7a9b63f88a0726aec6c
      base_sha: 29b16b3d0437335402a2c350c0958e4a9c229b09
      disposable_base_sha: 9d4dc05724e55a9b090e0895abbf24ff5be97fed
      reconcile_candidate: false
  recover:
    if: inputs.mode == 'recovery' && inputs.producer_run_id != ''
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@ab288d823433eace4f98f7a9b63f88a0726aec6c
    with:
      suite_id: p11-611bdc7f1256e000fde672b3
      scenario: edit
      candidate_sha: ab288d823433eace4f98f7a9b63f88a0726aec6c
      base_sha: 29b16b3d0437335402a2c350c0958e4a9c229b09
      disposable_base_sha: 9d4dc05724e55a9b090e0895abbf24ff5be97fed
      reconcile_candidate: true
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_run_attempt: '1'
