name: sofa hosted E2E candidate
on:
  workflow_dispatch:
    inputs:
      sofa_pr: {type: string, required: false}
      candidate_sha: {type: string, required: false}
      base_sha: {type: string, required: false}
      source_run_id: {type: string, required: false}
      source_run_attempt: {type: string, required: false}
      mode: {type: string, required: false}
      producer_run_id: {type: string, required: false}
permissions: {}
jobs:
  candidate:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@9f8c8837b93de44662c768580a9f57ccc57775a6
    with:
      suite_id: p19-a472c05e51e6117455e8d046
      scenario: edit
      candidate_sha: 9f8c8837b93de44662c768580a9f57ccc57775a6
      base_sha: 8ee343c441c81ff0eb35ca4bcfdb10bce48c0513
      disposable_base_sha: deb2316c258dc04756bc4b61cb2d239c90328934
      reconcile_candidate: false
      publish_fault: before-publication
  deny-non-ready:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@9f8c8837b93de44662c768580a9f57ccc57775a6
    with:
      suite_id: p19-5022837b471870821dfd2765
      scenario: denied
      denial_kind: non-ready
      candidate_sha: 9f8c8837b93de44662c768580a9f57ccc57775a6
      base_sha: 8ee343c441c81ff0eb35ca4bcfdb10bce48c0513
      disposable_base_sha: deb2316c258dc04756bc4b61cb2d239c90328934
      reconcile_candidate: false
  deny-completed-redelivery:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@9f8c8837b93de44662c768580a9f57ccc57775a6
    with:
      suite_id: p19-37ab4ab0836ccb4ddbe5efd6
      scenario: denied
      denial_kind: completed-redelivery
      candidate_sha: 9f8c8837b93de44662c768580a9f57ccc57775a6
      base_sha: 8ee343c441c81ff0eb35ca4bcfdb10bce48c0513
      disposable_base_sha: deb2316c258dc04756bc4b61cb2d239c90328934
      reconcile_candidate: false
  recover:
    if: inputs.mode == 'recovery' && inputs.producer_run_id != ''
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@9f8c8837b93de44662c768580a9f57ccc57775a6
    with:
      suite_id: p19-a472c05e51e6117455e8d046
      scenario: edit
      candidate_sha: 9f8c8837b93de44662c768580a9f57ccc57775a6
      base_sha: 8ee343c441c81ff0eb35ca4bcfdb10bce48c0513
      disposable_base_sha: deb2316c258dc04756bc4b61cb2d239c90328934
      reconcile_candidate: true
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_run_attempt: '1'
