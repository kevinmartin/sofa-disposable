name: sofa hosted E2E candidate
on:
  workflow_dispatch:
    inputs:
      sofa_pr: {type: string, required: false}
      candidate_sha: {type: string, required: false}
      base_sha: {type: string, required: false}
      source_run_id: {type: string, required: false}
      source_run_attempt: {type: string, required: false}
      mode: {type: string, required: false}
      producer_run_id: {type: string, required: false}
permissions: {}
jobs:
  candidate:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@9b13967eeecf59777eaf2e878fc7534ba7d1a35c
    with:
      suite_id: p22-0553ad5bcb86b918bdd49677
      scenario: edit
      candidate_sha: 9b13967eeecf59777eaf2e878fc7534ba7d1a35c
      base_sha: 41cb5efad9a53a197f9bd8c3e661577b38da2ab7
      disposable_base_sha: 52426e5df23e810df397d9c1c34694fca1e18e06
      reconcile_candidate: false
      publish_fault: before-publication
  deny-non-ready:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@9b13967eeecf59777eaf2e878fc7534ba7d1a35c
    with:
      suite_id: p22-36bca28e74171480323b1719
      scenario: denied
      denial_kind: non-ready
      candidate_sha: 9b13967eeecf59777eaf2e878fc7534ba7d1a35c
      base_sha: 41cb5efad9a53a197f9bd8c3e661577b38da2ab7
      disposable_base_sha: 52426e5df23e810df397d9c1c34694fca1e18e06
      reconcile_candidate: false
  deny-completed-redelivery:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@9b13967eeecf59777eaf2e878fc7534ba7d1a35c
    with:
      suite_id: p22-0db3e3d33ca29c03543c1076
      scenario: denied
      denial_kind: completed-redelivery
      candidate_sha: 9b13967eeecf59777eaf2e878fc7534ba7d1a35c
      base_sha: 41cb5efad9a53a197f9bd8c3e661577b38da2ab7
      disposable_base_sha: 52426e5df23e810df397d9c1c34694fca1e18e06
      reconcile_candidate: false
  recover:
    if: inputs.mode == 'recovery' && inputs.producer_run_id != ''
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@9b13967eeecf59777eaf2e878fc7534ba7d1a35c
    with:
      suite_id: p22-0553ad5bcb86b918bdd49677
      scenario: edit
      candidate_sha: 9b13967eeecf59777eaf2e878fc7534ba7d1a35c
      base_sha: 41cb5efad9a53a197f9bd8c3e661577b38da2ab7
      disposable_base_sha: 52426e5df23e810df397d9c1c34694fca1e18e06
      reconcile_candidate: true
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_run_attempt: '1'
