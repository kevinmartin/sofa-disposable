name: sofa hosted E2E candidate
on:
  workflow_dispatch:
    inputs:
      sofa_pr: {type: string, required: false}
      candidate_sha: {type: string, required: false}
      base_sha: {type: string, required: false}
      source_run_id: {type: string, required: false}
      source_run_attempt: {type: string, required: false}
      mode: {type: string, required: false}
      producer_run_id: {type: string, required: false}
permissions: {}
jobs:
  candidate:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@f83edf188915dfde6795acfbf50c0c94ce047f2e
    with:
      suite_id: p18-9748eecc3f6acb82fa5d95eb
      scenario: edit
      candidate_sha: f83edf188915dfde6795acfbf50c0c94ce047f2e
      base_sha: 177a29b2076e77310f481ca307fe8a1b633de8e8
      disposable_base_sha: 668fd6ae47c11e72fe100a75cba9311b17fd614f
      reconcile_candidate: false
      publish_fault: before-publication
  deny-non-ready:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@f83edf188915dfde6795acfbf50c0c94ce047f2e
    with:
      suite_id: p18-f3f260d654af9855897f71cb
      scenario: denied
      denial_kind: non-ready
      candidate_sha: f83edf188915dfde6795acfbf50c0c94ce047f2e
      base_sha: 177a29b2076e77310f481ca307fe8a1b633de8e8
      disposable_base_sha: 668fd6ae47c11e72fe100a75cba9311b17fd614f
      reconcile_candidate: false
  deny-completed-redelivery:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@f83edf188915dfde6795acfbf50c0c94ce047f2e
    with:
      suite_id: p18-dcbb0dbefa3c04e263d8dcac
      scenario: denied
      denial_kind: completed-redelivery
      candidate_sha: f83edf188915dfde6795acfbf50c0c94ce047f2e
      base_sha: 177a29b2076e77310f481ca307fe8a1b633de8e8
      disposable_base_sha: 668fd6ae47c11e72fe100a75cba9311b17fd614f
      reconcile_candidate: false
  recover:
    if: inputs.mode == 'recovery' && inputs.producer_run_id != ''
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@f83edf188915dfde6795acfbf50c0c94ce047f2e
    with:
      suite_id: p18-9748eecc3f6acb82fa5d95eb
      scenario: edit
      candidate_sha: f83edf188915dfde6795acfbf50c0c94ce047f2e
      base_sha: 177a29b2076e77310f481ca307fe8a1b633de8e8
      disposable_base_sha: 668fd6ae47c11e72fe100a75cba9311b17fd614f
      reconcile_candidate: true
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_run_attempt: '1'
