name: sofa hosted E2E candidate
on:
  workflow_dispatch:
    inputs:
      sofa_pr: {type: string, required: false}
      candidate_sha: {type: string, required: false}
      base_sha: {type: string, required: false}
      source_run_id: {type: string, required: false}
      source_run_attempt: {type: string, required: false}
      mode: {type: string, required: false}
      producer_run_id: {type: string, required: false}
permissions: {}
jobs:
  candidate:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@ba972cd8c0bd63032b4d1aa458b5370152327495
    with:
      suite_id: p24-538b44a1a9324a7ab3b852ed
      scenario: edit
      candidate_sha: ba972cd8c0bd63032b4d1aa458b5370152327495
      base_sha: 57ea8d431f9b26df02230fd30095f3a430d4c63b
      disposable_base_sha: 78e3696989f849c21aa15e0d2456d12e35e1439a
      reconcile_candidate: false
      publish_fault: before-publication
  deny-non-ready:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@ba972cd8c0bd63032b4d1aa458b5370152327495
    with:
      suite_id: p24-8e1bc562d4dc0efc62371ce1
      scenario: denied
      denial_kind: non-ready
      candidate_sha: ba972cd8c0bd63032b4d1aa458b5370152327495
      base_sha: 57ea8d431f9b26df02230fd30095f3a430d4c63b
      disposable_base_sha: 78e3696989f849c21aa15e0d2456d12e35e1439a
      reconcile_candidate: false
  deny-completed-redelivery:
    if: inputs.mode == 'initial'
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@ba972cd8c0bd63032b4d1aa458b5370152327495
    with:
      suite_id: p24-b72c4d1da482312b4b137694
      scenario: denied
      denial_kind: completed-redelivery
      candidate_sha: ba972cd8c0bd63032b4d1aa458b5370152327495
      base_sha: 57ea8d431f9b26df02230fd30095f3a430d4c63b
      disposable_base_sha: 78e3696989f849c21aa15e0d2456d12e35e1439a
      reconcile_candidate: false
  recover:
    if: inputs.mode == 'recovery' && inputs.producer_run_id != ''
    permissions:
      contents: read
      actions: read
    uses: kevinmartin/sofa/.github/workflows/e2e-fake.yml@ba972cd8c0bd63032b4d1aa458b5370152327495
    with:
      suite_id: p24-538b44a1a9324a7ab3b852ed
      scenario: edit
      candidate_sha: ba972cd8c0bd63032b4d1aa458b5370152327495
      base_sha: 57ea8d431f9b26df02230fd30095f3a430d4c63b
      disposable_base_sha: 78e3696989f849c21aa15e0d2456d12e35e1439a
      reconcile_candidate: true
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_run_attempt: '1'
