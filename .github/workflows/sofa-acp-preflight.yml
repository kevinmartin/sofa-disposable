name: sofa ACP preflight

on:
  workflow_dispatch:

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' && github.event.repository.fork == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Initialize redacted probe report
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sofa-acp-preflight-result"
          cat > "$RUNNER_TEMP/sofa-acp-preflight-result/report.json" <<'JSON'
          {
            "schema": 1,
            "status": "not_run",
            "copilot_version": "1.0.86",
            "copilot_binary_sha256": "ea4a519d7b2ff54e9c7d10ae9921cf4ab3f5041489ec340852f47f4f63fc535b",
            "copilot_package_sha256": "53284019748ac198c3dbcf9ba17f0541c8fcaaee16e6c644eb0e7285cdfd6112",
            "image": "node:24-bookworm@sha256:b977d0f785d96029d8d4c0790b6bf1c2a4c72e0f26319808e7ba2e9d966a1ac3",
            "variants": [
              {"name": "baseline", "exit_code": null},
              {"name": "roomy_tmp", "exit_code": null},
              {"name": "node_user", "exit_code": null},
              {"name": "package_entry", "exit_code": null}
            ]
          }
          JSON
      - name: Check out disposable workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: consumer
      - name: Check out trusted sofa diagnostic
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: kevinmartin/sofa
          ref: 9ddab3f9f91c363836426da903178ecfc11a4e28
          persist-credentials: false
          path: toolkit
      - name: Verify trusted diagnostic commit
        run: test "$(git -C toolkit rev-parse HEAD)" = 9ddab3f9f91c363836426da903178ecfc11a4e28
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: toolkit/go.mod
          cache: false
      - name: Build trusted zero-prompt probe
        shell: bash
        working-directory: toolkit
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p "$RUNNER_TEMP/sofa-probe"
          go build -trimpath -o "$RUNNER_TEMP/sofa-probe/sofa-acp-preflight" ./cmd/acp-preflight
      - name: Fetch checked Copilot ACP runtime
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/copilot-bin"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/copilot-linux-x64.tar.gz" \
            https://github.com/github/copilot-cli/releases/download/v1.0.86/copilot-linux-x64.tar.gz
          echo 'ea4a519d7b2ff54e9c7d10ae9921cf4ab3f5041489ec340852f47f4f63fc535b  '"$RUNNER_TEMP/copilot-linux-x64.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/copilot-linux-x64.tar.gz" -C "$RUNNER_TEMP/copilot-bin"
          test -x "$RUNNER_TEMP/copilot-bin/copilot"
          mkdir -p "$RUNNER_TEMP/copilot-package"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/github-copilot-linux-x64.tgz" \
            https://github.com/github/copilot-cli/releases/download/v1.0.86/github-copilot-1.0.86-linux-x64.tgz
          echo '53284019748ac198c3dbcf9ba17f0541c8fcaaee16e6c644eb0e7285cdfd6112  '"$RUNNER_TEMP/github-copilot-linux-x64.tgz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/github-copilot-linux-x64.tgz" -C "$RUNNER_TEMP/copilot-package"
          test -f "$RUNNER_TEMP/copilot-package/package/index.js"
      - name: Compare zero-prompt ACP startup variants
        shell: bash
        env:
          SOFA_MODEL_TOKEN: ${{ github.token }}
        run: |
          baseline_exit=not_run
          roomy_tmp_exit=not_run
          node_user_exit=not_run
          package_entry_exit=not_run
          for variant in baseline roomy_tmp node_user package_entry; do
            user_arg="$(id -u):$(id -g)"
            tmp_size=256m
            package_entry=
            case "$variant" in
              roomy_tmp) tmp_size=512m ;;
              node_user) user_arg=node ;;
              package_entry) package_entry=/copilot-package/package/index.js ;;
            esac
            echo "sofa ACP preflight variant: $variant"
            if docker run --rm --platform linux/amd64 \
              --user "$user_arg" \
              --cap-drop ALL --security-opt no-new-privileges --read-only \
              --pids-limit 128 --memory 3g --cpus 2 \
              --tmpfs "/tmp:rw,nosuid,nodev,size=$tmp_size" \
              --tmpfs /home/sofa:rw,nosuid,nodev,size=64m \
              --mount "type=bind,src=$PWD/consumer,dst=/workspace" \
              --mount "type=bind,src=$RUNNER_TEMP/sofa-probe,dst=/toolkit,readonly" \
              --mount "type=bind,src=$RUNNER_TEMP/copilot-bin,dst=/copilot,readonly" \
              --mount "type=bind,src=$RUNNER_TEMP/copilot-package,dst=/copilot-package,readonly" \
              --env SOFA_MODEL_TOKEN \
              --env SOFA_COPILOT_ENTRY="$package_entry" \
              --env HOME=/home/sofa \
              --env PATH=/toolkit:/copilot:/usr/local/bin:/usr/bin:/bin \
              node:24-bookworm@sha256:b977d0f785d96029d8d4c0790b6bf1c2a4c72e0f26319808e7ba2e9d966a1ac3 \
              /toolkit/sofa-acp-preflight; then
              code=0
            else
              code=$?
            fi
            echo "sofa ACP preflight variant exit: $variant $code"
            case "$variant" in
              baseline) baseline_exit=$code ;;
              roomy_tmp) roomy_tmp_exit=$code ;;
              node_user) node_user_exit=$code ;;
              package_entry) package_entry_exit=$code ;;
            esac
          done
          report_status=failed
          if (( package_entry_exit == 0 )); then
            report_status=passed
          fi
          cat > "$RUNNER_TEMP/sofa-acp-preflight-result/report.json" <<JSON
          {
            "schema": 1,
            "status": "$report_status",
            "copilot_version": "1.0.86",
            "copilot_binary_sha256": "ea4a519d7b2ff54e9c7d10ae9921cf4ab3f5041489ec340852f47f4f63fc535b",
            "copilot_package_sha256": "53284019748ac198c3dbcf9ba17f0541c8fcaaee16e6c644eb0e7285cdfd6112",
            "image": "node:24-bookworm@sha256:b977d0f785d96029d8d4c0790b6bf1c2a4c72e0f26319808e7ba2e9d966a1ac3",
            "variants": [
              {"name": "baseline", "exit_code": $baseline_exit},
              {"name": "roomy_tmp", "exit_code": $roomy_tmp_exit},
              {"name": "node_user", "exit_code": $node_user_exit},
              {"name": "package_entry", "exit_code": $package_entry_exit}
            ]
          }
          JSON
          if (( package_entry_exit != 0 )); then
            echo 'Required package_entry ACP startup failed' >&2
            exit 1
          fi
      - name: Upload redacted probe report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sofa-acp-preflight-report
          path: ${{ runner.temp }}/sofa-acp-preflight-result/report.json
          if-no-files-found: error
          retention-days: 14
