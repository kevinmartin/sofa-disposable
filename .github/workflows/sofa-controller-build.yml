# Secretless controller build for the exact reviewed Sofa revision used by
# lifecycle polls. Dispatch before the first wake and again before expiry.
name: sofa disposable controller build

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: github.event.repository.fork == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    uses: kevinmartin/sofa/.github/workflows/controller-build.reusable.yml@e1d6814a686982804a843573d537028b8af464e6
    with:
      toolkit_sha: e1d6814a686982804a843573d537028b8af464e6
